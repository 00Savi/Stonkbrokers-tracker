name: Fetch Protocol Data

on:
  schedule:
    # Hourly. This was 0 */4 * * * while yield still walked Blockscout
    # txlist/tokentx enough to burn Pro credits into HTTP 402; after moving
    # holders, supplies, logs, and most balances onto gg-index/RPC, a run
    # is a few hundred credits against a 100k/day free cap.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# The job checks out, indexes, then pushes. Two runs overlapping in that
# window both commit a rewritten data.json against the same base, and
# whichever pushes second is rejected as non-fast-forward. cancel-in-progress
# lets a manual run supersede an in-flight one rather than queue behind it.
concurrency:
  group: fetch-protocol-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # npm ci, not npm install: it installs exactly what package-lock.json
      # pins and fails if the lock and package.json disagree. `npm install
      # ethers` re-resolved dependencies on every run, so ^6.13.0 was free to
      # drift to any 6.x -- it had already reached 6.17.0. An upstream
      # regression would have broken the hourly job with no change on our side
      # and nothing in the diff to explain it.
      - name: Install Dependencies
        run: npm ci

      # The indexer cache must survive between runs, or every run rescans from
      # the genesis block -- which is what the old setup did, because the cache
      # was written to the runner and only data.json was committed.
      #
      # This is the Actions cache rather than git on purpose. Committing it
      # works, but the files are rewritten every hour, which measured out at
      # ~40KB of new git objects per run -- roughly 342MB/year on a repo that
      # is currently ~1MB. The Actions cache is built for exactly this and
      # costs the repository nothing.
      #
      # restore-keys makes the lookup a prefix match, so each run restores the
      # most recent previous cache and saves a new one under its own key.
      # The path has to match where fetchAllLogs actually writes:
      # cache_<key>_logs.json at the repo root, NOT a cache/ directory. As
      # written before, this step cached a directory that never existed, so
      # every run silently rescanned from the genesis block. That is also why
      # the job takes ~6 minutes.
      - name: Restore indexer cache
        uses: actions/cache@v4
        with:
          path: cache_*.json
          key: indexer-cache-${{ github.run_id }}
          restore-keys: |
            indexer-cache-

      - name: Run Fetcher Script
        run: node fetcher.cjs
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}

      # Belt and suspenders alongside the concurrency group: that stops this
      # workflow racing itself, but an unrelated push to main during the ~6
      # minute run window would still reject us. Retry against the moved remote
      # instead of failing the run.
      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # public/data.json is what the next build reads; docs/data.json is what
          # Pages actually serves. The fetcher writes both -- commit both, or the
          # live site stays pinned to whenever someone last ran a build by hand.
          git add public/data.json docs/data.json
          git commit -m "Automated data sync" || exit 0
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt of 3), rebasing onto origin/$BRANCH"
            git fetch origin "$BRANCH"
            # The data payload is regenerated in full each run, so our copy is
            # strictly the newer snapshot -- take it wholesale rather than
            # attempting a line-level merge of generated JSON. During a rebase our
            # commit is the one being replayed, which -X calls "theirs".
            git rebase "origin/$BRANCH" -X theirs || { git rebase --abort; exit 1; }
            sleep 5
          done
          git push
        env:
          BRANCH: ${{ github.ref_name }}
