name: Update Tracker Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically at minute 0 past every 6th hour

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for the bot to push data.json back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Clears the Node 20 deprecation warning

      - name: Install dependencies
        run: npm install ethers

      - name: Run updater
        run: node fetcher.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Automated sync: Update Global Yield ROI Benchmarks" || echo "No changes to commit"
          git push
