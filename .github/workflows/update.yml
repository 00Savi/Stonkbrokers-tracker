name: Fetch Protocol Data

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # npm ci, not npm install: it installs exactly what package-lock.json
      # pins and fails if the lock and package.json disagree. `npm install
      # ethers` re-resolved dependencies on every run, so ^6.13.0 was free to
      # drift to any 6.x -- it had already reached 6.17.0. An upstream
      # regression would have broken the hourly job with no change on our side
      # and nothing in the diff to explain it.
      - name: Install Dependencies
        run: npm ci

      # The indexer cache must survive between runs, or every run rescans from
      # the genesis block -- which is what the old setup did, because the cache
      # was written to the runner and only data.json was committed.
      #
      # This is the Actions cache rather than git on purpose. Committing it
      # works, but the files are rewritten every hour, which measured out at
      # ~40KB of new git objects per run -- roughly 342MB/year on a repo that
      # is currently ~1MB. The Actions cache is built for exactly this and
      # costs the repository nothing.
      #
      # restore-keys makes the lookup a prefix match, so each run restores the
      # most recent previous cache and saves a new one under its own key.
      - name: Restore indexer cache
        uses: actions/cache@v4
        with:
          path: cache
          key: indexer-cache-${{ github.run_id }}
          restore-keys: |
            indexer-cache-

      - name: Run Fetcher Script
        run: node fetcher.js
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automated data sync" || echo "No changes to commit"
          git push
