<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Ecosystem Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #cbd5e1; }
        .card { background-color: #1e293b; border-color: #334155; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .dropdown-menu { display: none; }
        .dropdown-container:hover .dropdown-menu { display: block; }
        @keyframes pulse-border {
            0% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { border-color: rgba(245, 158, 11, 0); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0); }
            100% { border-color: rgba(245, 158, 11, 0); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .mining-card {
            animation: pulse-border 3s infinite;
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9) 0%, rgba(67, 33, 10, 0.25) 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #60a5fa; }
    </style>
</head>
